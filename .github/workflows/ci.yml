name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        shell: nix develop --no-write-lock-file --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Install dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check warnings
        run: moon check --deny-warn
      - name: Test
        run: moon test
      - name: Build native release
        run: moon build --target native --release
